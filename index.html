const toHour = (t) => {
  if (!t) return -1;
  const p = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!p) return -1;
  let h = parseInt(p[1]);
  if (p[3].toUpperCase()==="PM" && h!==12) h+=12;
  if (p[3].toUpperCase()==="AM" && h===12) h=0;
  return h;
};

              </select>
            </div>
            {selContact.lastContact&&<div style={{background:"rgba(108,92,231,0.1)",borderRadius:7,padding:9,marginTop:6}}><div style={{color:"#8B7FD4",fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em"}}>Last Contact</div><div style={{color:"#ccc",fontSize:12,marginTop:2}}>{selContact.lastContact}</div></div>}
            <div style={{background:"rgba(108,92,231,0.1)",borderRadius:7,padding:9,marginTop:7}}>
              <div style={{color:"#8B7FD4",fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:5}}>Notes</div>
              <textarea value={selContact.notes||""} onChange={e=>{const u=contacts.map(c=>c.id===selContact.id?{...c,notes:e.target.value}:c);saveCon(u);setSelContact(p=>({...p,notes:e.target.value}));}} placeholder="Add notes..." rows={4} style={{width:"100%",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(108,92,231,0.25)",borderRadius:7,padding:"7px 9px",color:"#ccc",fontSize:12,lineHeight:1.5,resize:"vertical",outline:"none",boxSizing:"border-box",fontFamily:"Arial,sans-serif"}}/>
            </div>
            <button style={{width:"100%",background:"#6C5CE7",border:"none",color:"#fff",borderRadius:9,padding:"11px 0",marginTop:12,cursor:"pointer",fontWeight:"bold",fontSize:13}}>Send Outreach Email →</button>
            <button onClick={()=>{if(window.confirm(`Delete ${selContact.first} ${selContact.last}?`)){saveCon(contacts.filter(c=>c.id!==selContact.id));setSelContact(null);}}} style={{width:"100%",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.35)",color:"#EF4444",borderRadius:9,padding:"10px 0",marginTop:7,cursor:"pointer",fontWeight:"bold",fontSize:13}}>Delete Contact</button>
          </div>
        </div>
      ) : (
        <div style={{padding:"14px 18px"}}>
          {contacts.map(c=>(
            <button key={c.id} onClick={()=>setSelContact(c)} style={{width:"100%",display:"flex",alignItems:"center",gap:10,background:"#0F0A1E",border:"1px solid rgba(108,92,231,0.15)",borderRadius:11,padding:"11px 12px",marginBottom:7,cursor:"pointer",textAlign:"left"}}>
              <div style={{width:36,height:36,borderRadius:"50%",background:sam.color+"33",border:`1px solid ${sam.color}`,display:"flex",alignItems:"center",justifyContent:"center",color:sam.color,fontWeight:"bold",fontSize:13,flexShrink:0}}>{c.first[0]}</div>
              <div style={{flex:1,minWidth:0}}><div style={{color:"#fff",fontWeight:"bold",fontSize:13}}>{c.first} {c.last}</div><div style={{color:"#8B7FD4",fontSize:11}}>{c.title} · {c.company}</div></div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3,flexShrink:0}}>
                <span style={{background:TAG_COLORS[c.tag]?.bg,color:TAG_COLORS[c.tag]?.text,fontSize:10,padding:"2px 8px",borderRadius:20}}>{c.tag}</span>
                {c.vertical&&<span style={{background:"rgba(0,0,0,0.3)",color:VERTICAL_COLORS[c.vertical]||"#8B7FD4",fontSize:9,padding:"1px 6px",borderRadius:10,border:`1px solid ${VERTICAL_COLORS[c.vertical]||"#6C5CE7"}40`}}>{c.vertical}</span>}
              </div>
            </button>
          ))}
        </div>
      )}

      {showAddContact&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"#0F0A1E",borderRadius:"18px 18px 0 0",padding:20,width:"100%",border:"1px solid rgba(108,92,231,0.3)"}}>
            <div style={{color:"#fff",fontSize:14,fontWeight:"bold",marginBottom:14}}>Add Contact</div>
            <div style={{marginBottom:9}}>
              <div style={{color:"#8B7FD4",fontSize:10,marginBottom:3}}>Vertical</div>
              <select value={newContact.vertical||""} onChange={e=>setNewContact(p=>({...p,vertical:e.target.value}))} style={{width:"100%",background:"rgba(108,92,231,0.1)",border:"1px solid rgba(108,92,231,0.25)",borderRadius:7,padding:"7px 9px",color:"#fff",fontSize:13,boxSizing:"border-box",outline:"none"}}>
                <option value="">Select vertical...</option>
                {VERTICALS.map(v=><option key={v}>{v}</option>)}
              </select>
            </div>
            {[["First Name","first"],["Last Name","last"],["Company","company"],["Title","title"],["Email","email"],["Phone","phone"],["LinkedIn","linkedin"],["Notes","notes"]].map(([lbl,field])=>(
              <div key={field} style={{marginBottom:9}}>
                <div style={{color:"#8B7FD4",fontSize:10,marginBottom:3}}>{lbl}</div>
                <input value={newContact[field]} onChange={e=>setNewContact(p=>({...p,[field]:e.target.value}))} style={{width:"100%",background:"rgba(108,92,231,0.1)",border:"1px solid rgba(108,92,231,0.25)",borderRadius:7,padding:"7px 9px",color:"#fff",fontSize:13,boxSizing:"border-box",outline:"none"}}/>
              </div>
            ))}
            <div style={{display:"flex",gap:9,marginTop:12}}>
              <button onClick={()=>setShowAddContact(false)} style={{flex:1,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#ccc",borderRadius:9,padding:"10px 0",cursor:"pointer"}}>Cancel</button>
              <button onClick={()=>{saveCon([...contacts,{...newContact,id:Date.now(),tag:"Awareness",lastContact:"",vertical:newContact.vertical||""}]);setShowAddContact(false);setNewContact({first:"",last:"",company:"",title:"",email:"",phone:"",notes:"",linkedin:""});}} style={{flex:1,background:"#6C5CE7",border:"none",color:"#fff",borderRadius:9,padding:"10px 0",cursor:"pointer",fontWeight:"bold"}}>Add Contact</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  const renderMeetings = () => (
    <div style={{paddingBottom:80}}>
      <div style={{background:`linear-gradient(135deg,${PU},#1A1040)`,padding:"18px 18px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{color:"#fff",fontSize:16,fontWeight:"bold"}}>Meetings</div>
          <button onClick={()=>setShowAddMeeting(true)} style={{background:"#6C5CE7",border:"none",color:"#fff",width:30,height:30,borderRadius:"50%",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
        </div>
        <div style={{display:"flex",gap:7,marginTop:10,flexWrap:"wrap"}}>
          {Object.entries(STATUS_CONFIG).map(([k,v])=>(
            <div key={k} style={{background:v.bg+"33",border:`1px solid ${v.dot}40`,borderRadius:7,padding:"3px 9px",display:"flex",alignItems:"center",gap:4}}>
              <div style={{width:5,height:5,borderRadius:"50%",background:v.dot}}/>
              <span style={{color:v.text,fontSize:10}}>{meetings.filter(m=>m.status===k).length} {v.label}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{padding:"14px 18px"}}>
        {["confirmed","pending","unconfirmed","cancelled"].map(status=>{
          const cfg=STATUS_CONFIG[status], group=meetings.filter(m=>m.status===status);
          if(!group.length)return null;
          return (
            <div key={status} style={{marginBottom:18}}>
              <div style={{color:cfg.text,fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:7,display:"flex",alignItems:"center",gap:5}}>
                <div style={{width:5,height:5,borderRadius:"50%",background:cfg.dot}}/>{cfg.label}
              </div>
              {group.map(m=><MtgCard key={m.id} m={m}/>)}
            </div>
          );
        })}
      </div>
      {showAddMeeting&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"#0F0A1E",borderRadius:"18px 18px 0 0",padding:20,width:"100%",border:"1px solid rgba(108,92,231,0.3)"}}>
            <div style={{color:"#fff",fontSize:14,fontWeight:"bold",marginBottom:14}}>Add Meeting</div>
            {[["Contact Name","contact"],["Company","company"],["Date (e.g. Jun 16, 2026)","date"],["Time (e.g. 7:30 AM)","time"],["Location","location"]].map(([lbl,field])=>(
              <div key={field} style={{marginBottom:9}}><div style={{color:"#8B7FD4",fontSize:10,marginBottom:3}}>{lbl}</div><input value={newMeeting[field]} onChange={e=>setNewMeeting(p=>({...p,[field]:e.target.value}))} style={{width:"100%",background:"rgba(108,92,231,0.1)",border:"1px solid rgba(108,92,231,0.25)",borderRadius:7,padding:"7px 9px",color:"#fff",fontSize:13,boxSizing:"border-box",outline:"none"}}/></div>
            ))}
            <div style={{marginBottom:9}}><div style={{color:"#8B7FD4",fontSize:10,marginBottom:3}}>Status</div><select value={newMeeting.status} onChange={e=>setNewMeeting(p=>({...p,status:e.target.value}))} style={{width:"100%",background:"rgba(108,92,231,0.1)",border:"1px solid rgba(108,92,231,0.25)",borderRadius:7,padding:"7px 9px",color:"#fff",fontSize:13,outline:"none"}}><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="unconfirmed">Unconfirmed</option></select></div>
            <div style={{display:"flex",gap:9,marginTop:12}}>
              <button onClick={()=>setShowAddMeeting(false)} style={{flex:1,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#ccc",borderRadius:9,padding:"10px 0",cursor:"pointer"}}>Cancel</button>
              <button onClick={()=>{saveMtg([...meetings,{...newMeeting,id:Date.now()}]);setShowAddMeeting(false);setNewMeeting({contact:"",company:"",date:"",time:"",location:"",type:"1:1",status:"pending"});}} style={{flex:1,background:"#6C5CE7",border:"none",color:"#fff",borderRadius:9,padding:"10px 0",cursor:"pointer",fontWeight:"bold"}}>Add Meeting</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  const renderConference = () => (
    <div style={{paddingBottom:80}}>
      <div style={{background:`linear-gradient(135deg,${PU},#1A1040)`,padding:"18px 18px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{color:"#fff",fontSize:16,fontWeight:"bold"}}>Conference Info</div>
          <button onClick={()=>setShowAddMisc(true)} style={{background:"#6C5CE7",border:"none",color:"#fff",width:30,height:30,borderRadius:"50%",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
        </div>
        <div style={{color:"#8B7FD4",fontSize:11,marginTop:3}}>{myConfs.length} conferences · Know Before You Go</div>
      </div>
      <div style={{padding:"14px 18px"}}>
        {myConfs.map((conf,ci)=>(
          <div key={ci} style={{background:"#0F0A1E",border:"1px solid rgba(108,92,231,0.2)",borderRadius:14,marginBottom:14,overflow:"hidden"}}>
            <div style={{background:"rgba(108,92,231,0.15)",padding:"12px 14px",borderBottom:"1px solid rgba(108,92,231,0.15)"}}>
              <div style={{color:"#A29BFE",fontWeight:"bold",fontSize:14}}>{conf.name}</div>
              <div style={{color:"#6C5CE7",fontSize:11,marginTop:3}}>📅 {conf.dates}</div>
              <a href={conf.mapLink} target="_blank" rel="noreferrer" style={{color:"#8B7FD4",fontSize:11,display:"block",marginTop:2,textDecoration:"none"}}>📍 {conf.location} →</a>
            </div>
            <div style={{padding:12}}>
              <div style={{color:"#6C5CE7",fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:7}}>Rough Schedule</div>
              {conf.schedule.map((s,i)=>(
                <div key={i} style={{display:"flex",gap:8,marginBottom:5}}>
                  <div style={{color:"#4A3F80",fontSize:10,width:58,flexShrink:0}}>{s.time}</div>
                  <div style={{color:"#ccc",fontSize:12,lineHeight:1.4}}>{s.item}</div>
                </div>
              ))}
              <div style={{borderTop:"1px solid rgba(108,92,231,0.15)",paddingTop:10,marginTop:8}}>
                <div style={{color:"#A29BFE",fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:7}}>⚡ Protege Notes</div>
                {conf.protege.map((p,i)=><div key={i} style={{color:"#ccc",fontSize:12,marginBottom:4,paddingLeft:9,borderLeft:"2px solid #6C5CE7"}}>{p}</div>)}
              </div>
              {(confMisc[conf.name]||[]).length>0&&(
                <div style={{borderTop:"1px solid rgba(108,92,231,0.15)",paddingTop:10,marginTop:8}}>
                  <div style={{color:"#8B7FD4",fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:7}}>Your Notes</div>
                  {(confMisc[conf.name]||[]).map((note,i)=><div key={i} style={{color:"#ccc",fontSize:12,marginBottom:4,background:"rgba(255,255,255,0.03)",borderRadius:5,padding:"5px 9px"}}>{note}</div>)}
                </div>
              )}
            </div>
          </div>
        ))}
      </div>
      {showAddMisc&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:"#0F0A1E",borderRadius:"18px 18px 0 0",padding:20,width:"100%",border:"1px solid rgba(108,92,231,0.3)"}}>
            <div style={{color:"#fff",fontSize:14,fontWeight:"bold",marginBottom:14}}>Add Conference Note</div>
            <div style={{marginBottom:9}}><div style={{color:"#8B7FD4",fontSize:10,marginBottom:3}}>Conference</div><select id="mconf" style={{width:"100%",background:"rgba(108,92,231,0.1)",border:"1px solid rgba(108,92,231,0.25)",borderRadius:7,padding:"7px 9px",color:"#fff",fontSize:13,outline:"none"}}>{myConfs.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}</select></div>
            <div style={{marginBottom:9}}><div style={{color:"#8B7FD4",fontSize:10,marginBottom:3}}>Note</div><textarea value={newMisc} onChange={e=>setNewMisc(e.target.value)} rows={3} style={{width:"100%",background:"rgba(108,92,231,0.1)",border:"1px solid rgba(108,92,231,0.25)",borderRadius:7,padding:"7px 9px",color:"#fff",fontSize:13,boxSizing:"border-box",resize:"none",outline:"none"}}/></div>
            <div style={{display:"flex",gap:9,marginTop:12}}>
              <button onClick={()=>setShowAddMisc(false)} style={{flex:1,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#ccc",borderRadius:9,padding:"10px 0",cursor:"pointer"}}>Cancel</button>
              <button onClick={()=>{const sel=document.getElementById("mconf")?.value||myConfs[0]?.name;if(sel){const u={...confMisc,[sel]:[...(confMisc[sel]||[]),newMisc]};saveMsc(u);}setShowAddMisc(false);setNewMisc("");}} style={{flex:1,background:"#6C5CE7",border:"none",color:"#fff",borderRadius:9,padding:"10px 0",cursor:"pointer",fontWeight:"bold"}}>Add Note</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  const renderScanner = () => (
    <div style={{paddingBottom:80}}>
      <div style={{background:`linear-gradient(135deg,${PU},#1A1040)`,padding:"18px 18px 14px"}}>
        <div style={{color:"#fff",fontSize:16,fontWeight:"bold"}}>Badge Scanner</div>
        <div style={{color:"#8B7FD4",fontSize:11,marginTop:3}}>Scan a badge to add instantly to Clients</div>
      </div>
      <div style={{padding:"18px 18px"}}>
        {!scanMode&&!scanned?(
          <div style={{textAlign:"center"}}>
            <div style={{background:"#0F0A1E",border:"2px dashed rgba(108,92,231,0.4)",borderRadius:18,padding:"36px 18px",marginBottom:18}}>
              <div style={{fontSize:44,marginBottom:14}}>⬡</div>
              <div style={{color:"#A29BFE",fontWeight:"bold",fontSize:15}}>Tap to Scan Badge</div>
              <div style={{color:"#4A3F80",fontSize:12,marginTop:7}}>Point camera at conference badge to extract contact info via LinkedIn</div>
              <button onClick={()=>setScanMode(true)} style={{background:"#6C5CE7",border:"none",color:"#fff",borderRadius:11,padding:"12px 28px",marginTop:18,cursor:"pointer",fontWeight:"bold",fontSize:14}}>Open Camera</button>
            </div>
            <div style={{color:"#4A3F80",fontSize:11,marginBottom:10}}>Or simulate a badge scan:</div>
            {SAMPLE_BADGES.map((b,i)=>(
              <button key={i} onClick={()=>setScanned({...b,id:Date.now(),tag:"Awareness",notes:"",lastContact:"",phone:""})} style={{width:"100%",display:"flex",alignItems:"center",gap:10,background:"#0F0A1E",border:"1px solid rgba(108,92,231,0.2)",borderRadius:11,padding:"11px 12px",marginBottom:7,cursor:"pointer",textAlign:"left"}}>
                <div style={{width:36,height:36,borderRadius:"50%",background:"rgba(108,92,231,0.2)",display:"flex",alignItems:"center",justifyContent:"center",color:"#A29BFE",fontWeight:"bold",fontSize:13}}>{b.first[0]}</div>
                <div><div style={{color:"#fff",fontWeight:"bold",fontSize:13}}>{b.first} {b.last}</div><div style={{color:"#8B7FD4",fontSize:11}}>{b.title} · {b.company}</div></div>
                <span style={{marginLeft:"auto",color:"#6C5CE7",fontSize:18}}>›</span>
              </button>
            ))}
          </div>
        ):scanMode?(
          <div style={{textAlign:"center"}}>
            <div style={{background:"#0F0A1E",borderRadius:18,padding:18,marginBottom:14}}>
              <div style={{width:"100%",aspectRatio:"4/3",background:"rgba(0,0,0,0.5)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",border:"2px solid #6C5CE7",position:"relative",overflow:"hidden"}}>
                <div style={{position:"absolute",inset:0,background:"linear-gradient(transparent 40%,rgba(108,92,231,0.1) 50%,transparent 60%)",animation:"scan 2s linear infinite"}}/>
                <div style={{color:"#6C5CE7",fontSize:12}}>Camera active · Align badge in frame</div>
              </div>
              <button onClick={()=>{setScanMode(false);setScanned({...SAMPLE_BADGES[0],id:Date.now(),tag:"Awareness",notes:"",lastContact:"",phone:""});}} style={{background:"#6C5CE7",border:"none",color:"#fff",borderRadius:11,padding:"11px 26px",marginTop:14,cursor:"pointer",fontWeight:"bold"}}>Simulate Scan</button>
            </div>
            <button onClick={()=>setScanMode(false)} style={{background:"none",border:"none",color:"#8B7FD4",cursor:"pointer",fontSize:12}}>Cancel</button>
          </div>
        ):scanned?(
          <div>
            <div style={{background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:11,padding:"9px 12px",marginBottom:14,display:"flex",alignItems:"center",gap:7}}>
              <span style={{color:"#22C55E",fontSize:15}}>✓</span><span style={{color:"#22C55E",fontSize:12}}>Badge scanned successfully</span>
            </div>
            <div style={{background:"#0F0A1E",border:"1px solid rgba(108,92,231,0.2)",borderRadius:14,padding:16}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                <div style={{width:44,height:44,borderRadius:"50%",background:"rgba(108,92,231,0.2)",display:"flex",alignItems:"center",justifyContent:"center",color:"#A29BFE",fontWeight:"bold",fontSize:17}}>{scanned.first[0]}</div>
                <div><div style={{color:"#fff",fontWeight:"bold",fontSize:16}}>{scanned.first} {scanned.last}</div><div style={{color:"#8B7FD4",fontSize:12}}>{scanned.title} · {scanned.company}</div></div>
              </div>
              {[["✉",scanned.email],["in",scanned.linkedin]].map(([icon,val])=>val&&<div key={icon} style={{display:"flex",gap:9,marginBottom:7}}><span style={{color:"#6C5CE7",width:18,fontSize:12}}>{icon}</span><span style={{color:"#ccc",fontSize:12}}>{val}</span></div>)}
              <div style={{display:"flex",gap:9,marginTop:14}}>
                <button onClick={()=>setScanned(null)} style={{flex:1,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#ccc",borderRadius:9,padding:"10px 0",cursor:"pointer"}}>Discard</button>
                <button onClick={()=>{saveCon([...contacts,scanned]);setScanned(null);setTab("clients");}} style={{flex:1,background:"#22C55E",border:"none",color:"#fff",borderRadius:9,padding:"10px 0",cursor:"pointer",fontWeight:"bold"}}>Add Connection +</button>
              </div>
            </div>
          </div>
        ):null}
      </div>
    </div>
  );

  return (
    <div style={{maxWidth:430,margin:"0 auto",minHeight:"100vh",background:"#080612",fontFamily:"Arial,sans-serif",position:"relative"}}>
      <style>{`*{box-sizing:border-box;}input,select,textarea{outline:none;font-family:Arial,sans-serif;}button{font-family:Arial,sans-serif;}@keyframes scan{0%{transform:translateY(-100%);}100%{transform:translateY(200%);}}::-webkit-scrollbar{width:0;}`}</style>
      <div style={{overflowY:"auto",height:"calc(100vh - 62px)"}}>
        {tab==="home"&&renderHome()}
        {tab==="clients"&&renderClients()}
        {tab==="meetings"&&renderMeetings()}
        {tab==="conference"&&renderConference()}
        {tab==="scanner"&&renderScanner()}
      </div>
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"rgba(10,6,20,0.97)",backdropFilter:"blur(20px)",borderTop:"1px solid rgba(108,92,231,0.2)",display:"flex",zIndex:50}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"9px 4px 7px",background:"none",border:"none",cursor:"pointer",position:"relative"}}>
            {tab===t.id&&<div style={{position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",width:28,height:2,background:"#6C5CE7",borderRadius:2}}/>}
            <span style={{fontSize:17,opacity:tab===t.id?1:0.4,color:tab===t.id?"#A29BFE":"#fff"}}>{t.icon}</span>
            <span style={{fontSize:9,color:tab===t.id?"#A29BFE":"#4A3F80",letterSpacing:"0.04em"}}>{t.label}</span>
          </button>
        ))}
      </div>
      <div style={{position:"fixed",top:10,right:10,zIndex:200}}>
        <button onClick={()=>{setUser(null);setTab("home");}} style={{background:"rgba(108,92,231,0.15)",border:"1px solid rgba(108,92,231,0.3)",color:"#8B7FD4",borderRadius:18,padding:"4px 11px",fontSize:10,cursor:"pointer"}}>⟵ Switch</button>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ProtegeApp));
  </script>
</body>
</html>
